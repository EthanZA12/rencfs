name: windows-winfsp-check

on:
  push:
    branches:
      - feature/windows-winfsp
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install compatible Rust nightly
        shell: pwsh
        run: |
          rustup toolchain install nightly-2026-05-03 --component rustfmt --component clippy
          rustup override set nightly-2026-05-03
          rustc --version
          cargo --version

      - name: Cargo check
        run: cargo check --all

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build Windows executable
        shell: pwsh
        env:
          WINFSP_DLL_OUTPUT_PATH: target/debug
        run: cargo build --all

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: rencfs-windows-debug
          path: |
            target/debug/rencfs.exe
            target/debug/*.dll
